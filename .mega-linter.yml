ENABLE:
  - ACTION
  - CPP
  - DOCKERFILE
  - JSON
  - MARKDOWN
  - REPOSITORY
  - SPELL
  - XML
  - YAML
DISABLE_LINTERS:
  - CPP_CPPLINT
  - CPP_CPPCHECK
  - REPOSITORY_DEVSKIM
  - REPOSITORY_GITLEAKS
  - REPOSITORY_KICS
  - REPOSITORY_SEMGREP
  # No package manifests/lockfiles (package.json, requirements.txt, go.mod, ...)
  # exist in this repo, so osv-scanner always errors with
  # "No package sources found" instead of reporting on dependencies.
  - REPOSITORY_OSV_SCANNER
  - SPELL_CSPELL
  - JSON_V8R
  - ACTION_ZIZMOR
DISABLE_ERRORS_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - SPELL_LYCHEE
PRINT_ALPACA: false
SARIF_REPORTER: true
SHOW_SKIPPED_LINTERS: false
FILTER_REGEX_EXCLUDE: (hal_st/middlewares/STM32_WPAN/)
JSON_JSONLINT_ARGUMENTS: --mode cjson
